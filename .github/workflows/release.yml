name: Build and Replace v1.2.0 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller huggingface_hub
          pip install llama-cpp-python --extra-index-url https://github.io
          python -c "import llama_cpp; print('llama_cpp verified!')"

      - name: Build dist\app with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --icon="icon\arb_icon.ico" `
            --add-data "icon\arb_icon.ico;." `
            --hidden-import=llama_cpp `
            --collect-all llama_cpp `
            --collect-all huggingface_hub `
            app.py

      - name: Compile setup.iss with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss

      - name: Overwrite EXE in v1.2.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          files: installer_output/ARB_Universal_IDE.exe
          overwrite_files: true
