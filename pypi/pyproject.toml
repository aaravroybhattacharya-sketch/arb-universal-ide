[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-universal-ide"
version = "2.0.3"
description = "100% offline AI multi-language compiler IDE powered by embedded local Qwen 2.5 Coder 7B."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Aarav Roy Bhattacharya" }
]
keywords = ["ai", "ide", "compiler", "offline-ai", "local-llm", "qwen", "llama-cpp-python", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "llama-cpp-python",
    "huggingface-hub"
]

[project.urls]
Homepage = "https://vercel.app"
Repository = "https://github.com"
Issues = "https://github.com/issues"

[tool.setuptools]
py-modules = ["app"]
