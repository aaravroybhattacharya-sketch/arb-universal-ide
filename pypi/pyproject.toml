[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-universal-ide"
version = "2.0.1"
description = "100% offline AI multi-language compiler IDE powered by embedded local Qwen 2.5 Coder 7B."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.md" }
requires-python = ">=3.9"
authors = [
    { name = "Aarav Roy Bhattacharya" }
]
keywords = ["ai", "ide", "compiler", "offline-ai", "local-llm", "qwen", "llama-cpp-python", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Integrated Development Environments (IDE)",
]
dependencies = [
    "llama-cpp-python",
    "huggingface-hub"
]

[project.urls]
Homepage = "https://vercel.app"
Repository = "https://github.com"
Issues = "https://github.com/issues"
