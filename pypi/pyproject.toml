[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-universal-ide"
version = "2.0.5"
description = "100% offline, multi-model AI IDE that converts plain English into runnable multi-file projects across 8 languages."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aarav Roy Bhattacharya" }
]
keywords = ["ai", "ide", "compiler", "offline-ai", "local-llm", "qwen", "ollama", "lm-studio", "code-generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "llama-cpp-python",
    "huggingface-hub"
]

[project.urls]
Homepage = "https://arb-universal-ide.vercel.app"
Repository = "https://github.com/aaravroybhattacharya-sketch/arb-universal-ide"
Issues = "https://github.com/aaravroybhattacharya-sketch/arb-universal-ide/issues"

[tool.setuptools]
py-modules = ["app"]
